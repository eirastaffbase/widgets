<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recognition widget preview</title>
  <style>
    body { margin: 0; padding: 32px 16px; background: #eef0f4; font-family: system-ui, sans-serif; }
    main { max-width: 520px; margin: auto; }
    h1 { font-size: 18px; }
    p { font-size: 13px; line-height: 1.5; color: #525866; }
    recognition-widget { display: block; background: white; border-radius: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Recognition widget preview</h1>
    <p>Uses the built widget inside a shadow root, with synthetic colleagues and an in-memory API. No Staffbase requests or real notifications are sent.</p>
    <div id="preview"></div>
    <button id="outside" type="button">Outside the widget</button>
  </main>
  <script src="preview.js"></script>
  <script src="dist/recognition-widget.js"></script>
</body>
</html>
