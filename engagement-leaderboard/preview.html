<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engagement Leaderboard — Preview</title>
<style>
  body{margin:0;background:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:24px 16px;color:#111827}
  .wrap{max-width:1080px;margin:0 auto}
  .cfg{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:16px;margin-bottom:20px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
  label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
  input,select{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid rgba(0,0,0,.16);
    border-radius:8px;box-sizing:border-box}
  button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border:0;border-radius:8px;
    background:#0EA5E9;color:#fff;cursor:pointer}
  .stage{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:20px}
  .stage.bare{background:none;border:0;padding:0}
  .hint{font-size:12px;color:#6b7280;grid-column:1/-1;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="cfg">
    <div><label for="baseurl">Base URL</label><input id="baseurl" placeholder="https://acme.staffbase.com/api"></div>
    <div><label for="apitoken">API Token</label><input id="apitoken" type="password" placeholder="Basic token"></div>
    <div><label for="timewindow">Period</label>
      <select id="timewindow">
        <option value="90d" selected>Last 90 days</option>
        <option value="30d">Last 30 days</option>
        <option value="7d">Last 7 days</option>
        <option value="12m">Last 12 months</option>
        <option value="all">All time</option>
        <option value="custom">Custom range</option>
      </select></div>
    <div><label for="topn">People per metric</label><input id="topn" type="number" value="5" min="2" max="10"></div>
    <div><label for="displaymode">Layout</label>
      <select id="displaymode"><option value="slideshow" selected>Slideshow</option><option value="grid">Grid</option></select></div>
    <div><label for="showbubblemap">Engagement map</label>
      <select id="showbubblemap"><option value="false" selected>Off</option><option value="true">On</option></select></div>
    <div><label for="colorscheme">Color scheme</label>
      <select id="colorscheme"><option value="dark" selected>Dark</option><option value="light">Light</option><option value="auto">Auto</option></select></div>
    <div><label for="reactiontypes">Reaction types</label>
      <select id="reactiontypes"><option value="true" selected>On</option><option value="false">Off</option></select></div>
    <div><label for="debugmode">Debug mode</label>
      <select id="debugmode"><option value="false" selected>Off</option><option value="true">On</option></select></div>
    <div><button id="go">Render</button></div>
    <p class="hint">
      Leave the fields blank to see sample data. Avatars and profile hovercards only
      resolve inside the Staffbase app, where the session cookie is sent — here they
      fall back to gradient initials, which is the intended degraded state.
      Run <code>npm run build</code> first.
    </p>
  </div>
  <div class="stage bare" id="stage"></div>
</div>

<script>
// Minimal stand-in for the Staffbase widget host: enough of the SDK contract to
// instantiate the block as a custom element.
window.defineBlock = function (def) {
  const d = def.blockDefinition;
  const Base = class extends HTMLElement {
    connectedCallback() { this.renderBlock && this.renderBlock(this); }
    attributeChangedCallback() { this.innerHTML = ""; this.renderBlock && this.renderBlock(this); }
  };
  const widgetApi = { getContentLanguage: () => "en_US" };
  customElements.define(d.name, d.factory(Base, widgetApi));
  window.__blockName = d.name;
};
</script>
<script src="./dist/engagement-leaderboard.js"></script>
<script>
document.getElementById("go").addEventListener("click", function () {
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  const el = document.createElement(window.__blockName);
  ["baseurl", "apitoken", "timewindow", "topn", "displaymode", "showbubblemap", "colorscheme", "reactiontypes", "debugmode"].forEach(function (k) {
    const v = document.getElementById(k).value;
    if (v) el.setAttribute(k, v);
  });
  stage.appendChild(el);
});
document.getElementById("go").click();
</script>
</body>
</html>
