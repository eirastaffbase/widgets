<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Switcher — preview</title>
<style>
  /* Stand-in host page. Panels differ so the widget's inherited theming shows. */
  body{
    margin:0;padding:32px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f4f5f7;color:#141821;
  }
  .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;}
  .panel{
    flex:1 1 380px;max-width:520px;
    padding:20px;border-radius:14px;
    background:#fff;
  }
  .panel.dark{background:#14171a;color:#e8eaed;}
  .panel.narrow{max-width:300px;}
  .panel.wide{flex:1 1 100%;max-width:none;}
  h2{
    margin:0 0 14px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:700;color:#5b6470;
  }
  .panel.dark h2{color:#9aa4b0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel wide"><h2>Wide host</h2><div id="f"></div></div>
  <div class="panel wide"><h2>Wide host, images</h2><div id="g"></div></div>
  <div class="panel narrow"><h2>Narrow, images</h2><div id="h"></div></div>
  <div class="panel"><h2>Light host</h2><div id="a"></div></div>
  <div class="panel dark"><h2>Dark host</h2><div id="b"></div></div>
  <div class="panel narrow"><h2>Narrow</h2><div id="c"></div></div>
  <div class="panel"><h2>Empty</h2><div id="d"></div></div>
  <div class="panel"><h2>Invalid JSON</h2><div id="e"></div></div>
</div>

<script>
// Stub the Staffbase session endpoints.
const VIEWER = { id: "user-1", groupIDs: ["6967000000000000000000b2"] };
const GROUP_API = {
  "6967000000000000000000a1": { name: "Retail", description: "Stores, shift teams and field associates." },
  "6967000000000000000000b2": { name: "Manufacturing", description: "Plant floor, maintenance and safety." },
  // Localized map, to exercise the non-string branch.
  "6967000000000000000000c3": { name: { en_US: "Healthcare" }, description: { en_US: "Clinical and care teams." } },
  "6967000000000000000000d4": { name: "Financial Services", description: "" },
};
// ?delay=800 holds the loading state open; the default resolves immediately.
const DELAY = Number(new URLSearchParams(location.search).get("delay") || 0);
const realFetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const u = String(url);
  const json = (body) => new Response(JSON.stringify(body), { status: 200 });
  if (u.includes("/auth/discover")) return json({ user: VIEWER, csrfToken: "stub" });
  if (u.includes("/api/users/me")) return json(VIEWER);
  const g = u.match(/\/api\/groups\/([^/?]+)$/);
  if (g) {
    if (DELAY) await new Promise((r) => setTimeout(r, DELAY));
    return json({ id: g[1], ...(GROUP_API[g[1]] || {}) });
  }
  if (/\/api\/groups\/[^/]+\/members/.test(u)) return json({});
  if (u.includes("/theming/")) return new Response("{}", { status: 404 });
  return realFetch(url, opts);
};

// Stub the widget SDK.
const widgetApi = { getUserInformation: async () => VIEWER };

window.defineBlock = (external) => {
  const def = external.blockDefinition;
  class Base {
    getAttribute(name) {
      return Object.prototype.hasOwnProperty.call(this._attrs || {}, name) ? this._attrs[name] : null;
    }
  }
  const Widget = def.factory(Base, widgetApi);
  // The widget's constructor calls super() with no args, so attach attrs after.
  window.__mount = (el, attrs) => {
    const instance = new Widget();
    instance._attrs = attrs;
    Promise.resolve(instance.renderBlock(el)).catch((e) => {
      el.textContent = "renderBlock failed: " + e.message;
      console.error(e);
    });
  };
  window.dispatchEvent(new Event("widget-ready"));
};
</script>
<script src="./dist/group-switcher.js"></script>
<script>
// Name and description come from the stubbed API unless overridden here.
const GROUPS = JSON.stringify([
  { id: "6967000000000000000000a1", icon: "store" },
  { id: "6967000000000000000000b2", icon: "factory" },
  { id: "6967000000000000000000c3", icon: "health" },
  { id: "6967000000000000000000d4", description: "Overridden in config.", icon: "bank" },
]);

const shot = (h, c) =>
  "data:image/svg+xml;base64," + btoa(
    '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400">' +
    '<rect width="640" height="400" fill="hsl(' + h + ',42%,' + c + '%)"/>' +
    '<circle cx="470" cy="90" r="150" fill="hsl(' + h + ',52%,' + (c + 12) + '%)"/>' +
    '<rect y="270" width="640" height="130" fill="hsl(' + h + ',38%,' + (c - 10) + '%)"/></svg>');

const IMAGE_GROUPS = JSON.stringify([
  { id: "6967000000000000000000a1", icon: shot(14, 52) },
  { id: "6967000000000000000000b2", icon: shot(212, 46) },
  { id: "6967000000000000000000c3", icon: shot(160, 44) },
  { id: "6967000000000000000000d4", icon: shot(38, 54) },
]);

const base = { groups: GROUPS, accentcolor: "#1f6feb", usethemecolors: "false" };
window.__mount(document.getElementById("a"), base);
window.__mount(document.getElementById("b"), { ...base, accentcolor: "#5ea9ff" });
window.__mount(document.getElementById("c"), base);
window.__mount(document.getElementById("d"), { ...base, groups: "" });
window.__mount(document.getElementById("e"), { ...base, groups: "[{ oops }]" });
window.__mount(document.getElementById("f"), base);
window.__mount(document.getElementById("g"), { ...base, groups: IMAGE_GROUPS });
window.__mount(document.getElementById("h"), { ...base, groups: IMAGE_GROUPS });
</script>
</body>
</html>
